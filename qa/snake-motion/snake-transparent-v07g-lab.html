function drawMossSoilContact(seam,phase){

function drawRootedBotany(item){
 const mesh=botanyById.get(item.id);
 if(!mesh)throw Error('v07j_missing_source_botany_'+item.id);
 const leafColors=['#769773','#5f8d68','#91a77b','#456f5d','#829b6d'];
 const paletteIndex=((item.variant+item.tintStep)%leafColors.length+
  leafColors.length)%leafColors.length;
 const green=leafColors[paletteIndex];
 ctx.save();
 // Exact camera-projected root attachment; the collar is visibly embedded
 // in a thin soil mark, never placed on an arbitrary screen y.
 const soil=mesh.soilBase;
 if(mesh.type==='fern'){
  // Fern soil collar stays V0.7I; V0.7K alters only existing moss.
  ctx.fillStyle='#4a4230';
  ctx.beginPath();ctx.ellipse(soil.center.x,soil.center.y,
   Math.max(3,soil.width),Math.max(1,soil.height),
   0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(154,139,101,.48)';
  ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(soil.center.x-soil.width,soil.center.y+.8);
  ctx.quadraticCurveTo(soil.center.x,soil.center.y-soil.height*.6,
   soil.center.x+soil.width,soil.center.y+.8);ctx.stroke();
 }else{
  const contact=mossContactById.get(mesh.id);
  if(!contact)throw Error('v07k_missing_original_moss_contact_'+mesh.id);
  drawMossSoilContact(contact,'back');
 }
 if(mesh.type==='fern'){
  for(const frond of mesh.fronds){
   ctx.lineCap='round';
   // The stalk remains visible below the paired pinnae.
   for(const e of [frond.stipe,frond.rachis]){

    ctx.strokeStyle='#67846a';ctx.lineWidth=1.25;ctx.stroke();

      (pinna.index+frond.index)%4===0?'#a4b889':green);

function boulder(o,index){

     {x:xx+w*.12,y:cy-h*.35+j*2},color[0],1.3);
