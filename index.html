
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#1a110b">

    <title>鱗片與種子：地下生態物語</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a110b;
        }

        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overscroll-behavior: none;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            display: block;
            overflow: hidden;

            background: #1a110b;
        }

        #game-container canvas {
            position: absolute !important;

            top: 0 !important;
            left: 0 !important;

            display: block !important;

            width: 100% !important;
            height: 100% !important;

            max-width: none !important;
            max-height: none !important;

            margin: 0 !important;
            padding: 0 !important;

            transform: none !important;

            touch-action: none;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>


    <script>
    // 僅在 ?debug=title 時顯示，不影響正常遊戲畫面。
    if (new URLSearchParams(location.search).get('debug') === 'title') {
        window.addEventListener('DOMContentLoaded', async () => {
            const panel = document.createElement('div');
            panel.style.cssText = 'position:fixed;z-index:999999;top:8px;left:8px;right:8px;padding:10px;background:#21150ef2;color:#fff;font:13px/1.5 monospace;white-space:pre-wrap;border:2px solid #e9c17b;border-radius:8px;pointer-events:none';
            panel.textContent = 'TITLE DIAG v7 | 檢查中…';
            document.body.appendChild(panel);
            const url = 'assets/images/ui/main-menu/title-frame.png?diag=7';
            const image = new Image();
            const imageState = await new Promise(resolve => {
                image.onload = () => resolve('PNG OK ' + image.naturalWidth + '×' + image.naturalHeight);
                image.onerror = () => resolve('PNG LOAD ERROR');
                image.src = url;
            });
            let codeState = 'CODE CHECK ERROR';
            try {
                const response = await fetch('src/scenes/LoginScene.js?diag=7', { cache: 'no-store' });
                const body = await response.text();
                codeState = 'JS HTTP ' + response.status + ' / title=' + body.includes('drawMainMenuTitle') + ' / image=' + body.includes('main_menu_title_frame');
            } catch (error) { codeState = String(error); }
            panel.textContent = 'TITLE DIAG v7\\n' + imageState + '\\n' + codeState + '\\n畫面：' + innerWidth + '×' + innerHeight;
        });
    }
    </script>
    <script type="module" src="src/main.js?v=en-logo-approved-20261107-6"></script>

</body>
</html>
