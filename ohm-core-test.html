<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ohm Core 獨立架構測試</title><style>body{max-width:680px;margin:24px auto;padding:0 16px;background:#1b211d;color:#eee8d9;font:16px/1.6 system-ui}button{margin:4px;padding:10px 15px;background:#a5814e;border:0;border-radius:7px;color:#111;font-size:16px}pre{white-space:pre-wrap;word-break:break-word;background:#111b15;padding:14px;border-radius:8px}h1{font-size:22px}</style></head><body><h1>Ohm Core v0.2 — 世界與場景管理</h1><p>此頁面不啟動 Phaser、不使用登入或雲端資料，純粹測試遊戲規則引擎。僅供開發測試。</p><div id="tests">正在執行核心測試…</div><h2>互動示範</h2><p id="location"></p><div id="exits"></div><button id="observe">紀錄觀察</button><pre id="result"></pre><script type="module">
import {createWorld,dispatchWorld} from './src/ohm-core/world.mjs';
import {OHM_LOCATIONS,describeScene,travelToScene} from './src/ohm-core/scene-registry.mjs';
import {sceneRegistryResults,sceneRegistryPassed} from './tests/scene-registry.test.mjs';
import {readBrowserTimeContext} from './src/ohm-platform/browser-time-context.mjs';
import {dayPeriodResults,dayPeriodPassed} from './tests/day-period.test.mjs';
import {ohmCoreResults,ohmCorePassed} from './tests/ohm-core.test.mjs';
const $=id=>document.getElementById(id);
const allTests=[...ohmCoreResults,...sceneRegistryResults.map(([name,pass])=>({name,pass})),...dayPeriodResults.map(([name,pass])=>({name,pass}))];
const allPassed=ohmCorePassed&&sceneRegistryPassed&&dayPeriodPassed;
$('tests').textContent=(allPassed?'全部測試通過':'發現測試失敗')+'：'+allTests.filter(x=>x.pass).length+'/'+allTests.length+'\n'+allTests.map(x=>(x.pass?'✓ ':'✗ ')+x.name).join('\n');
$('tests').style.whiteSpace='pre-wrap';
let world=createWorld();
const actualTime=()=>readBrowserTimeContext({timeZone:'Asia/Taipei'});
function render(info='已啟動獨立核心'){
  const scene=describeScene(world,OHM_LOCATIONS);
  const time=actualTime();
  $('location').textContent=scene.ok
    ? '目前地點：'+scene.title+'｜'+scene.description+'｜現實時段：'+(time.ok?time.label:'偵測失敗')+'（裝置時間／台灣時區）｜觀察紀錄：'+world.observations.length
    : '場景資料異常：'+scene.error;
  const exits=$('exits');exits.replaceChildren();
  if(scene.ok) for(const exit of scene.exits){
    const button=document.createElement('button');
    button.textContent='前往：'+exit.title;
    button.addEventListener('click',()=>send({type:'TRAVEL',location:exit.id}));
    exits.appendChild(button);
  }
  $('result').textContent=info+'\\n'+JSON.stringify(world,null,2);
}
function send(command){
  const outcome=command.type==='TRAVEL'
    ?travelToScene(world,command.location,OHM_LOCATIONS)
    :dispatchWorld(world,command,OHM_LOCATIONS);
  if(outcome.ok)world=outcome.state;
  render(outcome.ok?'事件：'+outcome.events.map(x=>x.type).join(', '):'操作拒絕：'+outcome.error);
}
$('observe').onclick=()=>send({type:'OBSERVE'});
// Read-only automatic refresh; scene travel never advances clock.
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render('已重新偵測現實時段');});
window.addEventListener('focus',()=>render('已重新偵測現實時段'));
setInterval(()=>{if(!document.hidden)render('已自動更新現實時段');},60000);
render();
</script></body></html>
