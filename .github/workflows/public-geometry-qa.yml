name: Public Geometry QA

on:
  push:
    paths:
      - 'qa/public-geometry/**'
      - '.github/workflows/public-geometry-qa.yml'
  pull_request:
    paths:
      - 'qa/public-geometry/**'
      - '.github/workflows/public-geometry-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public-only JavaScript syntax
        run: |
          node --check qa/public-geometry/geometry.mjs
          node --check qa/public-geometry/geometry.test.mjs
      - name: Run independent public geometry fixtures
        run: node --test qa/public-geometry/geometry.test.mjs
