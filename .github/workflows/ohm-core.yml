name: Ohm Core checks
on:
  push:
    paths:
      - 'src/ohm-core/**'
      - 'tests/ohm-core.test.mjs'
      - 'tests/scene-registry.test.mjs'
      - 'tests/module-catalog.test.mjs'
      - 'ohm-lab.html'
      - 'docs/project-ohm/**'
      - 'src/ohm-platform/**'
      - 'tests/day-period.test.mjs'
      - 'tests/browser-game-clock.test.mjs'
      - 'tests/daily-time-checkpoints.test.mjs'
      - 'tests/offline-catch-up.test.mjs'
      - 'tests/reptile-motion.test.mjs'
      - 'tests/corn-snake-profile.test.mjs'
      - 'tests/corn-snake-motion.test.mjs'
      - 'tests/corn-snake-activity.test.mjs'
      - 'tests/corn-snake-activity-v06.test.mjs'
      - 'tests/corn-snake-occlusion-v06.test.mjs'
      - 'tests/corn-snake-silhouette-v06.test.mjs'
      - 'corn-snake-lab.html'
      - 'corn-snake-lab-v05.html'
      - 'corn-snake-lab-v06.html'
      - 'terrarium-showcase.html'
      - 'terrarium-autonomy-lab.html'
      - 'terrarium-multi-obstacle-lab.html'
      - 'tests/terrarium-multi-obstacle-lab.test.mjs'
      - 'tests/terrarium-autonomy-lab.test.mjs'
      - 'tests/terrarium-showcase.test.mjs'
      - '.github/workflows/ohm-core.yml'
  pull_request:
    paths:
      - 'src/ohm-core/**'
      - 'tests/ohm-core.test.mjs'
      - 'tests/scene-registry.test.mjs'
      - 'tests/module-catalog.test.mjs'
      - 'ohm-lab.html'
      - 'docs/project-ohm/**'
      - 'src/ohm-platform/**'
      - 'tests/day-period.test.mjs'
      - 'tests/browser-game-clock.test.mjs'
      - 'tests/daily-time-checkpoints.test.mjs'
      - 'tests/offline-catch-up.test.mjs'
      - 'tests/reptile-motion.test.mjs'
      - 'tests/corn-snake-profile.test.mjs'
      - 'tests/corn-snake-motion.test.mjs'
      - 'tests/corn-snake-activity.test.mjs'
      - 'tests/corn-snake-activity-v06.test.mjs'
      - 'tests/corn-snake-occlusion-v06.test.mjs'
      - 'tests/corn-snake-silhouette-v06.test.mjs'
      - 'corn-snake-lab.html'
      - 'corn-snake-lab-v05.html'
      - 'corn-snake-lab-v06.html'
      - 'terrarium-showcase.html'
      - 'terrarium-autonomy-lab.html'
      - 'terrarium-multi-obstacle-lab.html'
      - 'tests/terrarium-multi-obstacle-lab.test.mjs'
      - 'tests/terrarium-autonomy-lab.test.mjs'
      - 'tests/terrarium-showcase.test.mjs'
      - '.github/workflows/ohm-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check src/ohm-core/world.mjs
      - name: Project OHM catalog syntax check
        run: node --check src/ohm-core/module-catalog.mjs
      - name: Project OHM module catalog checks
        run: node tests/module-catalog.test.mjs
      - name: World rules test
        run: node tests/ohm-core.test.mjs
      - name: Scene registry syntax check
        run: node --check src/ohm-core/scene-registry.mjs
      - name: Scene registry navigation tests
        run: node tests/scene-registry.test.mjs
      - name: Real-world time adapter tests
        run: node tests/day-period.test.mjs
      - name: Gameplay clock tests
        run: node tests/browser-game-clock.test.mjs
      - name: Three daily checkpoints test
        run: node tests/daily-time-checkpoints.test.mjs
      - name: Offline catch-up policy tests
        run: node tests/offline-catch-up.test.mjs
      - name: Public terrarium B rock-edge route and controls
        run: node tests/terrarium-showcase.test.mjs
      - name: Autonomous terrarium rock-edge safety and interactive controls
        run: node tests/terrarium-autonomy-lab.test.mjs
      - name: Multi-obstacle terrarium route and shelter controls
        run: node tests/terrarium-multi-obstacle-lab.test.mjs
      - name: Reptile motion schema and transition tests
        run: node tests/reptile-motion.test.mjs
      - name: Corn snake appearance descriptors tests
        run: node tests/corn-snake-profile.test.mjs
      - name: Corn snake curve and seeded pattern tests
        run: node tests/corn-snake-motion.test.mjs
      - name: Corn snake natural activity and head gesture tests
        run: node tests/corn-snake-activity.test.mjs
      - name: Corn snake v0.6 seeded activity tests
        run: node tests/corn-snake-activity-v06.test.mjs
      - name: Corn snake v0.6 foliage occlusion tests
        run: node tests/corn-snake-occlusion-v06.test.mjs
      - name: Corn snake v0.6 head silhouette tests
        run: node tests/corn-snake-silhouette-v06.test.mjs
