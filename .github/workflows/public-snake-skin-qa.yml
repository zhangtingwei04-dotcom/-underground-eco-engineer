name: Public OHM Warmvein Q/T Pixel Skin QA
on:
  push:
    paths:
      - 'qa/snake-skin-v10b/**'
      - '.github/workflows/public-snake-skin-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-texture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse public skin sources
        run: |
          set -euo pipefail
          for f in qa/snake-skin-v10b/*.mjs qa/snake-skin-v10b/visual/*.mjs qa/snake-skin-v10b/tests/*.mjs qa/snake-skin-v10b/static-head/*.mjs; do
            node --check "$f"
          done
      - name: Execute Q/T atlas and WebGL capture contracts
        run: |
          set -euo pipefail
          for f in qa/snake-skin-v10b/tests/*.test.mjs; do
            node "$f"
          done

  true-webgl-qt-chrome:
    name: Real Chrome Q/T WebGL2 frame evidence
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Traditional Chinese glyphs for screenshot review
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Capture same actual 24-joint WebGL2 frame in wide and phone landscape
        env:
          OHM_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node qa/snake-skin-v10b/tests/warmvein-public-v10v-chrome-qa.mjs
      - name: Generate all 16 V1.1A real static gape camera screenshots
        env:
          OHM_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node qa/snake-skin-v10b/tests/warmvein-static-gape-v11a-chrome.mjs
      - name: Archive sixteen V1.1A actual GPU static images and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-warmvein-v11a-static-gape-16-views
          path: qa/snake-skin-v10b/.qa-artifacts/v11a-static/*
          retention-days: 7
          if-no-files-found: warn
      - name: Capture 32 V1.1B static real WebGL2 views (head and whole resting snake)
        env:
          OHM_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node qa/snake-skin-v10b/tests/warmvein-static-coil-v11b-chrome.mjs
      - name: Preserve 32 V1.1B static QA images and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-warmvein-v11b-static-head-and-coil-32-views
          path: qa/snake-skin-v10b/.qa-artifacts/v11b-static/*
          retention-days: 7
          if-no-files-found: warn
      - name: Keep actual GPU and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-warmvein-v10v-gpu-qt
          path: qa/snake-skin-v10b/.qa-artifacts/v10v-chrome/*.png
          retention-days: 7
          if-no-files-found: warn
