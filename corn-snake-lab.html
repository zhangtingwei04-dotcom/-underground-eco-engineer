<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>鱗片與種子｜玉米蛇動態原型</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#181811;color:#f1e5c5;font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:940px;margin:0 auto;padding:16px}header{margin-bottom:12px}h1{font-size:clamp(22px,5vw,32px);margin:8px 0}p{margin:8px 0;color:#c9c1aa}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#273328;border:2px solid #796343;border-radius:14px;touch-action:manipulation}
section{background:#29271d;padding:12px 16px;border:1px solid #655538;border-radius:12px;margin-top:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{background:#775b37;color:#fff4d7;border:1px solid #a98a5a;border-radius:8px;padding:11px;font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c2d89b}
label{display:flex;align-items:center;gap:8px}input[type=range]{width:110px;accent-color:#bca26e}small{color:#c3b89d}.tag{font-size:12px;background:#454a35;border-radius:5px;padding:3px 6px;display:inline-block}
a{color:#f2c987}#status{min-height:24px}
</style></head><body><main>
<header><span class="tag">Ohm Core 獨立可玩技術原型 v0.1</span><h1>玉米蛇｜動態與花紋實驗室</h1>
<p>這是無登入、無雲端存檔、無 Phaser 的獨立技術展示，不會影響正式遊戲。</p></header>
<canvas id="stage" width="960" height="540" role="img" aria-label="玉米蛇沿曲線滑行的動畫示範"></canvas>
<section class="controls">
<label for="morph">花紋／色型參考
<select id="morph"><option value="normal">原色 Normal</option><option value="amelanistic">白化 Amelanistic</option><option value="anerythristic">缺紅 Anerythristic</option><option value="motley">Motley 花紋</option><option value="stripe">Stripe 條紋</option></select></label>
<label for="speed">移動速度 <input id="speed" type="range" min="0" max="2" step="0.1" value="1"><output id="speedValue">1.0×</output></label>
<button id="pause" type="button">暫停</button><button id="reroll" type="button">生成新的個體紋路</button>
</section>
<section><strong>觀察說明</strong><p id="status" aria-live="polite"></p><small>目前運動路徑、波動幅度、花紋尺寸及配色是<strong>美術／技術測試參數</strong>，不是從實測玉米蛇資料校正的生物力學或遺傳模型。真實物種生理、飼養環境與品系遺傳將另行研究。</small></section>
<p><a href="./ohm-core-test.html">Ohm Core 世界核心測試</a> · <a href="./index.html">返回遊戲首頁</a></p>
</main>
<script type="module">
import {generateSnakePose,makeCornSnakePattern} from './src/ohm-core/corn-snake-motion.mjs';
import {createCornSnakeAppearance} from './src/ohm-core/corn-snake-profile.mjs';
const $=id=>document.getElementById(id);
const canvas=$('stage'),ctx=canvas.getContext('2d');
if(!ctx){$('status').textContent='此瀏覽器不支援 2D Canvas';throw new Error('canvas_unavailable');}
const palettes={
 normal:{body:'#cf8e49',spots:'#a34332',outline:'#513b2d',belly:'#eacb91',eyes:'#251d16'},
 amelanistic:{body:'#f4bb75',spots:'#d96d40',outline:'#f8e4ae',belly:'#fce9c2',eyes:'#ca3333'},
 anerythristic:{body:'#aaa79b',spots:'#56595a',outline:'#292f34',belly:'#d6d1bc',eyes:'#1d2226'},
 motley:{body:'#cf9450',spots:'#9c4937',outline:'#674835',belly:'#e5ce9d',eyes:'#1d1b16'},
 stripe:{body:'#d6a565',spots:'#9c4f38',outline:'#6a432e',belly:'#eed0a1',eyes:'#231d16'}
};
let morph='normal',seed=1049,marks=makeCornSnakePattern(seed).marks,elapsed=0,last=0,paused=false,speed=1;
const width=canvas.width,height=canvas.height;
function point(p){return {x:p.x*width,y:p.y*height};}
function normal(points,i){const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)];
const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;return {x:-dy/len,y:dx/len};}
function drawScene(){
 const bg=ctx.createLinearGradient(0,0,0,height);bg.addColorStop(0,'#293c35');bg.addColorStop(1,'#50452e');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);
 // Isolated artistic habitat: terrain does not simulate husbandry requirements.
 for(let i=0;i<27;i++){let x=30+(i*173)%900,y=60+(i*113)%470;
 ctx.fillStyle=i%2?'#71664c55':'#182e2855';ctx.beginPath();ctx.ellipse(x,y,15+i%7*5,8+i%5*4,0,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#d0c9ae';ctx.font='19px system-ui';ctx.fillText('玉米蛇｜獨立動態測試',26,35);
}
function drawSnake(pose){
 const pal=palettes[morph],pts=pose.map(point),n=pts.length-1,bodyWidth=22;
 // Polygon around centerline with taper at tail.
 const sides=[[],[]];
 for(let i=0;i<=n;i++){
  const v=normal(pts,i),s=i/n;
  const w=bodyWidth*(s<.72?1:Math.max(.06,(1-s)/.28));
  sides[0].push({x:pts[i].x+v.x*w,y:pts[i].y+v.y*w});
  sides[1].push({x:pts[i].x-v.x*w,y:pts[i].y-v.y*w});
 }
 ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sides[0][0].x,sides[0][0].y);
 for(const q of sides[0].slice(1))ctx.lineTo(q.x,q.y);
 for(const q of sides[1].reverse())ctx.lineTo(q.x,q.y);
 ctx.closePath();ctx.fillStyle=pal.body;ctx.strokeStyle=pal.outline;ctx.lineWidth=3;ctx.fill();ctx.stroke();
 // Underside edge approximated as subtle highlight; not anatomically accurate belly.
 ctx.beginPath();for(let i=0;i<=n;i++){const q=pts[i],v=normal(pts,i);const w=bodyWidth*.72*(i/n>.72?Math.max(.06,(1-i/n)/.28):1);
 if(i===0)ctx.moveTo(q.x+v.x*w,q.y+v.y*w);else ctx.lineTo(q.x+v.x*w,q.y+v.y*w);}
 ctx.strokeStyle=pal.belly;ctx.lineWidth=2.5;ctx.stroke();
 if(morph==='stripe'){
  for(const offset of [-0.46,.46]){ctx.beginPath();for(let i=1;i<n;i++){
   const v=normal(pts,i),s=i/n,w=bodyWidth*(s<.72?1:Math.max(.06,(1-s)/.28));
   const x=pts[i].x+v.x*w*offset,y=pts[i].y+v.y*w*offset;
   if(i===1)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }ctx.strokeStyle=pal.spots;ctx.lineWidth=7;ctx.stroke();}
 }else{
  for(const m of marks){
   const i=Math.min(n-2,Math.max(2,Math.round(m.position*n)));
   const s=i/n,bodyFactor=s<.72?1:Math.max(.06,(1-s)/.28);
   const v=normal(pts,i),t={x:-v.y,y:v.x},w=bodyWidth*bodyFactor;
   if(w<3)continue;
   ctx.save();ctx.translate(pts[i].x,pts[i].y);ctx.rotate(Math.atan2(t.y,t.x));
   const span=(morph==='motley'?22:14)*m.size;
   ctx.fillStyle=pal.spots;ctx.strokeStyle=pal.outline;ctx.lineWidth=morph==='amelanistic'?1:2;
   ctx.beginPath();ctx.ellipse(0,0,span,w*.85,m.angle,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.restore();
  }
 }
 // Head and eyes, heading toward leading point.
 const head=pts[0],behind=pts[3],angle=Math.atan2(head.y-behind.y,head.x-behind.x);
 ctx.save();ctx.translate(head.x,head.y);ctx.rotate(angle);
 ctx.fillStyle=pal.body;ctx.strokeStyle=pal.outline;ctx.lineWidth=2.5;
 ctx.beginPath();ctx.ellipse(6,0,32,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle=pal.eyes;for(const y of [-14,14]){ctx.beginPath();ctx.arc(16,y,3.5,0,Math.PI*2);ctx.fill();}
 ctx.restore();
}
let frames=0;
function tick(now){
 if(last===0)last=now;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(!paused)elapsed+=dt;
 drawScene();drawSnake(generateSnakePose(elapsed,{speed}));
 if(frames++%25===0)$('status').textContent='色型參考：'+$('morph').selectedOptions[0].textContent+'｜個體花紋種子：'+seed+'｜'+(paused?'已暫停':'動畫播放中');
 requestAnimationFrame(tick);
}
$('morph').addEventListener('change',()=>{morph=$('morph').value;const result=createCornSnakeAppearance({morphId:morph,patternSeed:seed});if(!result.ok)$('status').textContent=result.error;});
$('speed').addEventListener('input',()=>{speed=Number($('speed').value);$('speedValue').textContent=speed.toFixed(1)+'×';});
$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'繼續播放':'暫停';});
$('reroll').addEventListener('click',()=>{seed=(seed+104729)>>>0;marks=makeCornSnakePattern(seed).marks;});
requestAnimationFrame(tick);
</script></body></html>
